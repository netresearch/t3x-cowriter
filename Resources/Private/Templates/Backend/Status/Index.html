<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="LLL:EXT:t3_cowriter/Resources/Private/Language/locallang_mod_status.xlf:mlang_labels_tablabel" /></h1>

    <p class="mb-4"><f:translate key="LLL:EXT:t3_cowriter/Resources/Private/Language/locallang_mod_status.xlf:status.intro" /></p>

    <f:if condition="{result.ok}">
        <f:then>
            <div class="callout callout-success">
                <div class="callout-body">
                    <h4 class="callout-title"><f:translate key="LLL:EXT:t3_cowriter/Resources/Private/Language/locallang_mod_status.xlf:status.ok.title" /></h4>
                    <p><f:translate key="LLL:EXT:t3_cowriter/Resources/Private/Language/locallang_mod_status.xlf:status.ok.message" /></p>
                </div>
            </div>
        </f:then>
        <f:else>
            <div class="callout callout-danger">
                <div class="callout-body">
                    <h4 class="callout-title"><f:translate key="LLL:EXT:t3_cowriter/Resources/Private/Language/locallang_mod_status.xlf:status.incomplete.title" /></h4>
                    <p><f:translate key="LLL:EXT:t3_cowriter/Resources/Private/Language/locallang_mod_status.xlf:status.incomplete.message" /></p>
                </div>
            </div>
        </f:else>
    </f:if>

    <div class="table-fit mt-4">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th style="width: 40px;"></th>
                    <th><f:translate key="LLL:EXT:t3_cowriter/Resources/Private/Language/locallang_mod_status.xlf:status.column.check" /></th>
                    <th><f:translate key="LLL:EXT:t3_cowriter/Resources/Private/Language/locallang_mod_status.xlf:status.column.status" /></th>
                    <th style="width: 120px;"></th>
                </tr>
            </thead>
            <tbody>
                <f:for each="{checks}" as="check">
                    <tr>
                        <td>
                            <f:if condition="{check.passed}">
                                <f:then>
                                    <span class="text-success">
                                        <core:icon identifier="actions-check" size="small" />
                                    </span>
                                </f:then>
                                <f:else>
                                    <span class="text-danger">
                                        <core:icon identifier="actions-close" size="small" />
                                    </span>
                                </f:else>
                            </f:if>
                        </td>
                        <td>
                            <strong>{check.key}</strong>
                        </td>
                        <td>
                            {check.message}
                        </td>
                        <td>
                            <f:if condition="{check.fixRoute}">
                                <f:if condition="{fixUrls.{check.fixRoute}}">
                                    <a href="{fixUrls.{check.fixRoute}}"
                                       class="btn btn-default btn-sm">
                                        <f:translate key="LLL:EXT:t3_cowriter/Resources/Private/Language/locallang_mod_status.xlf:status.fix" />
                                    </a>
                                </f:if>
                            </f:if>
                        </td>
                    </tr>
                </f:for>
            </tbody>
        </table>
    </div>

    <div class="mt-4">
        <p class="text-body-secondary"><f:translate key="LLL:EXT:t3_cowriter/Resources/Private/Language/locallang_mod_status.xlf:status.footer" /></p>
    </div>
</f:section>

</html>
